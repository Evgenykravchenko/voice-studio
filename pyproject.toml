[project]
name = "fish-voice-cloner"
version = "0.1.1"
description = "Local Fish Audio S2 Pro voice cloning on Apple Silicon"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.13,<3.14"
dependencies = [
  "imageio-ffmpeg>=0.6.0",
  "mlx-speech",
  "mlx-whisper>=0.4.3",
]

[project.scripts]
voice-cloner = "voice_cloner.cli:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_cloner"]

